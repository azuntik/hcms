name: flutter_cms
description: A Flutter web CMS frontend for Hugo static sites
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI Components
  cupertino_icons: ^1.0.6

  # Rich Text Editor
  flutter_quill: ^9.3.0
  flutter_quill_extensions: ^9.3.0

  # Markdown support
  markdown: ^7.2.0
  flutter_markdown: ^0.6.18

  # State Management
  provider: ^6.1.1

  # Navigation
  go_router: ^13.0.0

  # HTTP Client
  http: ^1.2.0
  dio: ^5.4.0

  # File handling
  file_picker: ^6.1.1

  # Utilities
  intl: ^0.19.0
  uuid: ^4.3.3

  # YAML parsing for frontmatter
  yaml: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  # Add assets here
  # assets:
  #   - images/
